<html>
  <head>
    <meta charset="UTF-8">
    <title>bitnuke</title>

    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <body class=bg>
    <div class=tint>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.0/jquery.min.js"></script>
      <div id=pre_logo></div>
      <center><img src="static/bitnuke.png" alt="bitnuke.io" id=logo></br></center>
      <div id=post_logo></div>
      <center>
        <div>
          <p class=msg>
            bitnuke.io is an anonymous temporary file storage site.
          </p>
          <p class=msg>
            Your files are stored for 24 hours and then deleted permanently.
          </p>
        </div></br>
      </center>
      <div id=post_logo></div>
      <center>
      <form id="link" class="linkstyle">
        <input type="text" placeholder=" :link" name="link">
        <!--<input type="submit" value="submit">-->
      </form></br>
      <div id=writezone></div>
      </br>
      <div id=linkhistory></div>
      </center>
      <script>
      // Function to clean up cookies older than 24 hours (shared functionality with index.html)
      function cleanupOldCookies() {
          const now = new Date().getTime();
          const twentyFourHours = 24 * 60 * 60 * 1000; // 24 hours in milliseconds
          
          const allCookies = document.cookie.split(';');
          
          for (let i = 0; i < allCookies.length; i++) {
              const tmpCookie = allCookies[i].split(/=(.+)/);
              let name = tmpCookie[0];
              name = name.replace(/\s+/g, ''); // remove spaces
              
              if (tmpCookie[1]) {
                  try {
                      const encodedString = tmpCookie[1];
                      const decodedString = atob(encodedString);
                      const value = JSON.parse(decodedString);
                      
                      // Check if this cookie has a timestamp and if it's older than 24 hours
                      if (value.timestamp && (now - value.timestamp) > twentyFourHours) {
                          console.log(`Removing expired cookie: ${name}`);
                          // Set cookie expiration to past date to delete it
                          document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                      }
                  } catch (e) {
                      // If we can't parse the cookie, it might be from an old format or not ours
                      // Skip it to avoid errors
                      continue;
                  }
              }
          }
      }

      // Function to copy text to clipboard
      function copyToClipboard(text, button) {
        console.log('Attempting to copy to clipboard:', text);
        
        // Check if the Clipboard API is available
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function() {
            console.log('Clipboard API copy successful');
            // Visual feedback
            const originalText = button.innerHTML;
            button.innerHTML = '✓ Copied!';
            setTimeout(() => {
              button.innerHTML = originalText;
            }, 2000);
          }).catch(function(err) {
            console.error('Clipboard API failed:', err);
            fallbackCopyToClipboard(text, button);
          });
        } else {
          console.log('Clipboard API not available, using fallback');
          fallbackCopyToClipboard(text, button);
        }
      }

      // Fallback copy function for when Clipboard API is not available
      function fallbackCopyToClipboard(text, button) {
        try {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-999999px';
          textArea.style.top = '-999999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          
          if (successful) {
            console.log('Fallback copy successful');
            const originalText = button.innerHTML;
            button.innerHTML = '✓ Copied!';
            setTimeout(() => {
              button.innerHTML = originalText;
            }, 2000);
          } else {
            console.error('Fallback copy failed');
            const originalText = button.innerHTML;
            button.innerHTML = '✗ Copy Failed';
            setTimeout(() => {
              button.innerHTML = originalText;
            }, 2000);
          }
        } catch (err) {
          console.error('Exception in fallback copy:', err);
          const originalText = button.innerHTML;
          button.innerHTML = '✗ Copy Failed';
          setTimeout(() => {
            button.innerHTML = originalText;
          }, 2000);
        }
      }

      // Function to store shortened link in cookie
      function storeShortenedLink(originalUrl, shortId) {
        const linkData = {
          original_url: originalUrl,
          short_id: shortId,
          short_url: window.location.protocol + "//" + window.location.hostname + "/" + shortId,
          timestamp: new Date().getTime()
        };

        const encodedValue = btoa(JSON.stringify(linkData));
        
        // Set cookie to expire in 25 hours
        const expirationDate = new Date();
        expirationDate.setHours(expirationDate.getHours() + 25);
        document.cookie = `link_${shortId}=${encodedValue}; expires=${expirationDate.toUTCString()}; path=/`;
      }

      // Function to display link history
      function displayLinkHistory() {
        // Clean up old cookies first
        cleanupOldCookies();
        
        const cardContainer = document.getElementById('linkhistory');
        let historyHTML = '';
        
        const allCookies = document.cookie.split(';');
        const linkCookies = [];
        
        // Find all link cookies
        for (let i = 0; i < allCookies.length; i++) {
          const tmpCookie = allCookies[i].split(/=(.+)/);
          let name = tmpCookie[0];
          name = name.replace(/\s+/g, '');
          
          if (name.startsWith('link_') && tmpCookie[1]) {
            try {
              const decodedString = atob(tmpCookie[1]);
              const linkData = JSON.parse(decodedString);
              linkCookies.push(linkData);
            } catch (e) {
              // Skip invalid cookies
              continue;
            }
          }
        }
        
        if (linkCookies.length > 0) {
          historyHTML = '<div class="cards-container">';
          
          // Sort by timestamp (newest first)
          linkCookies.sort((a, b) => b.timestamp - a.timestamp);
          
          linkCookies.forEach(linkData => {
            historyHTML += '<div class="file-card">';
            
            // Single row card header with link info and copy button
            historyHTML += '<div class="card-header">';
            historyHTML += '<div class="file-info">';
            historyHTML += '<i class="material-icons file-icon">link</i>';
            historyHTML += '<div class="file-details">';
            historyHTML += '<h3 class="file-name"><a href="' + linkData.original_url + '" target="_blank">' + linkData.original_url + '</a></h3>';
            historyHTML += '<span class="file-status link-url">' + linkData.short_url + '</span>';
            historyHTML += '</div>';
            historyHTML += '</div>';
            historyHTML += '<button class="card-btn single-row-btn copy-short-link-btn" data-url="' + linkData.short_url.replace(/"/g, "&quot;") + '">';
            historyHTML += '<i class="material-icons">content_copy</i>';
            historyHTML += '<span>Copy Short Link</span>';
            historyHTML += '</button>';
            historyHTML += '</div>';
            
            historyHTML += '</div>';
          });
          
          historyHTML += '</div>';
        }
        
        cardContainer.innerHTML = historyHTML;
        
        // Add event listeners for copy buttons
        bindLinkButtonEvents();
      }

      function bindLinkButtonEvents() {
        console.log('Binding link button events...');
        
        // Copy short link buttons
        const copyButtons = document.querySelectorAll('.copy-short-link-btn');
        console.log('Found copy short link buttons:', copyButtons.length);
        copyButtons.forEach(button => {
          button.addEventListener('click', function() {
            console.log('Copy short link button clicked');
            const url = this.getAttribute('data-url');
            copyToClipboard(url, this);
          });
        });
      }

      // Clean up old cookies when page loads
      cleanupOldCookies();

      // Auto-enable snow during November and December
      function enableSeasonalSnow() {
          const currentDate = new Date();
          const currentMonth = currentDate.getMonth(); // 0 = January, 10 = November, 11 = December
          
          // Enable snow automatically for November (10) and December (11)
          if (currentMonth === 10 || currentMonth === 11) {
              if (typeof snowStorm !== 'undefined') {
                  snowStorm.start();
                  console.log("❄️ Winter snow automatically enabled for " + 
                      (currentMonth === 10 ? "November" : "December"));
              }
          }
      }

      // Call seasonal snow check after snowStorm is loaded
      setTimeout(enableSeasonalSnow, 100);

      // Display link history on page load
      displayLinkHistory();

      $('#link').submit(function () {
        const originalUrl = $('input[name="link"]').val();
        
        $.post('/compress', $('#link').serialize(), function (data) {
          // Store the shortened link in cookie
          storeShortenedLink(originalUrl, data);
          
          // Clear the input
          $('input[name="link"]').val('');
          
          // Clear the old display area
          $('#writezone').empty();
          
          // Refresh the link history display
          setTimeout(() => {
            displayLinkHistory();
          }, 100);
        });
        return false;
      });
      console.log("bitnuke.io")
      console.log("see you in 24 hours...")
      </script>
