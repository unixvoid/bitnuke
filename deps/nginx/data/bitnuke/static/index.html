      <center>
      <div id="dropzone">

      <div id=writezone></div>
      </br>
      <div id=writezone2></div>

      <script>
        // Function to clean up cookies older than 24 hours
        function cleanupOldCookies() {
            const now = new Date().getTime();
            const twentyFourHours = 24 * 60 * 60 * 1000; // 24 hours in milliseconds
            
            const allCookies = document.cookie.split(';');
            
            for (let i = 0; i < allCookies.length; i++) {
                const tmpCookie = allCookies[i].split(/=(.+)/);
                let name = tmpCookie[0];
                name = name.replace(/\s+/g, ''); // remove spaces
                
                if (tmpCookie[1]) {
                    try {
                        const encodedString = tmpCookie[1];
                        const decodedString = atob(encodedString);
                        const value = JSON.parse(decodedString);
                        
                        // Check if this cookie has a timestamp and if it's older than 24 hours
                        if (value.timestamp && (now - value.timestamp) > twentyFourHours) {
                            console.log(`Removing expired cookie: ${name}`);
                            // Set cookie expiration to past date to delete it
                            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                        }
                    } catch (e) {
                        // If we can't parse the cookie, it might be from an old format or not ours
                        // Skip it to avoid errors
                        continue;
                    }
                }
            }
        }

        function appendToCookie(cookieName, newField, newValue) {
            // Helper function to get cookie by name
            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
            }
        
            // Helper function to set cookie without changing expiration
            function setCookieWithoutChangingExpiration(name, value) {
                // Find the original cookie with its attributes
                const cookieString = document.cookie
                    .split('; ')
                    .find(row => row.startsWith(name + '='));
                
                if (cookieString) {
                    // Extract the attributes (path, domain, etc.) from the original cookie
                    const attributes = cookieString.substring(cookieString.indexOf('=') + 1 + value.length);
                    // Set the new cookie with the same attributes
                    document.cookie = `${name}=${value}${attributes}`;
                }
            }
        
            // Get the existing cookie value
            let cookieValue = getCookie(cookieName);
        
            if (cookieValue) {
                //console.log("on: " + cookieName)
                // Decode the base64 cookie content
                let decodedValue = atob(cookieValue);
        
                // Parse the decoded string as JSON
                let cookieObj = JSON.parse(decodedValue);
                //console.log("decodedValue: " + decodedValue)
        
                // Append the new field
                cookieObj[newField] = newValue;
        
                // Convert the updated object back to JSON string
                let updatedCookieValue = JSON.stringify(cookieObj);
                //console.log("updatedCookieValue: " + updatedCookieValue)
        
                // Encode the updated string back to Base64
                let encodedValue = btoa(updatedCookieValue);
        
                // Set the updated cookie without changing its expiration
                setCookieWithoutChangingExpiration(cookieName, encodedValue);
            } else {
                console.error("Cookie not found.");
            }
        }

        function removeLink(file_id, sec_key, removal_key) {
          //console.log(removal_key);
          // do a post to /remove
          var xhttp = new XMLHttpRequest();
          xhttp.open("POST", "/remove", false);
          xhttp.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
          xhttp.send("file_id=" + file_id +
              "&sec_key=" + sec_key +
              "&removal_key=" + removal_key);

          // reload the page/update table
          location.reload();
        }

        function shortenLink(file_id, sec_key) {
          // do a post to /compress
          var link = "link=" + window.location.protocol + "//" + window.location.hostname + "/" + file_id + "/" + sec_key;
          fetch("/compress", {
            method: "POST",
            body: link,
            headers: new Headers({
              'Content-Type': 'application/x-www-form-urlencoded'
            })
          })
          .then(response => {
            line_val = window.location.protocol + "//" + window.location.hostname + "/" + response.headers.get('Compressor')
            appendToCookie(file_id, 'compressed', line_val);
          })

          // reload the page/update table
          //location.reload();
          .finally(() => {
              setTimeout(() => {
                  location.reload();
              }, 500); // Allow a slight delay for the server to process
          });

        };

        // Function to copy text to clipboard
        function copyToClipboard(text, button) {
          navigator.clipboard.writeText(text).then(function() {
            // Visual feedback
            const originalText = button.innerHTML;
            button.innerHTML = '✓ Copied!';
            setTimeout(() => {
              button.innerHTML = originalText;
            }, 2000);
          }).catch(function(err) {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const originalText = button.innerHTML;
            button.innerHTML = '✓ Copied!';
            setTimeout(() => {
              button.innerHTML = originalText;
            }, 2000);
          });
        }

        // Function to format file size
        function formatFileSize(bytes) {
          if (bytes === 0) return 'Unknown size';
          const k = 1024;
          const sizes = ['bytes', 'KB', 'MB', 'GB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function checkCookies() {
          // Clean up old cookies first
          cleanupOldCookies();
          
          // initiate card-based layout
          var cardContainer = "<div class='cards-container'>";
          var allCookies = document.cookie.split(';');
          if (allCookies != "") {
            for (var i = 0 ; i < allCookies.length; i++) {
              var tmpCookie = allCookies[i].split(/=(.+)/);
              var name = tmpCookie[0];
              name = name.replace(/\s+/g, '');       // remove spaces
              
              if (tmpCookie[1]) {
                try {
                  encodedString = tmpCookie[1]
                  decodedString = atob(encodedString);
                  var value = JSON.parse(decodedString);

                  // Only process cookies that have our expected structure (file info)
                  if (value.sec_key && value.removal_key && value.file_name) {
                    //console.log(value)
                    
                    // Prepare links
                    var originalLink = window.location.protocol + "//" + window.location.hostname + "/" + name + "/" + value.sec_key;
                    var hasShortLink = "compressed" in value;
                    var shortLink = hasShortLink ? value.compressed : '';
                    var primaryLink = hasShortLink ? shortLink : originalLink;
                    
                    // Build file card
                    cardContainer += '<div class="file-card">';
                    
                    // Card header with file name and delete button
                    cardContainer += '<div class="card-header">';
                    cardContainer += '<div class="file-info">';
                    cardContainer += '<i class="material-icons file-icon">description</i>';
                    cardContainer += '<div class="file-details">';
                    cardContainer += '<h3 class="file-name"><a href="' + primaryLink + '" target="_blank">' + value.file_name + '</a></h3>';
                    
                    // Show file size if available, otherwise show "Unknown size"
                    var fileSize;
                    if (value.file_size !== undefined && value.file_size !== null && value.file_size !== 0) {
                      fileSize = formatFileSize(value.file_size);
                    } else {
                      fileSize = 'Unknown size';
                    }
                    cardContainer += '<span class="file-status">' + fileSize + '</span>';
                    cardContainer += '</div>';
                    cardContainer += '</div>';
                    cardContainer += '<button class="delete-btn-card" onclick="removeLink(\'' + name + '\',\'' + value.sec_key + '\',\'' + value.removal_key + '\');" title="Delete File">';
                    cardContainer += '<i class="material-icons">delete</i>';
                    cardContainer += '</button>';
                    cardContainer += '</div>';
                    
                    // Card body with action buttons
                    cardContainer += '<div class="card-body">';
                    
                    // Primary copy button
                    cardContainer += '<button class="card-btn primary-btn" onclick="copyToClipboard(\'' + primaryLink + '\', this)">';
                    cardContainer += '<i class="material-icons">content_copy</i>';
                    cardContainer += '<span>Copy Link</span>';
                    cardContainer += '</button>';
                    
                    // Secondary button (shorten or copy short)
                    if (hasShortLink) {
                      cardContainer += '<button class="card-btn secondary-btn" onclick="copyToClipboard(\'' + shortLink + '\', this)">';
                      cardContainer += '<i class="material-icons">content_copy</i>';
                      cardContainer += '<span>Copy Short</span>';
                      cardContainer += '</button>';
                    } else {
                      cardContainer += '<button class="card-btn secondary-btn" onclick="shortenLink(\'' + name + '\',\'' + value.sec_key + '\');">';
                      cardContainer += '<i class="material-icons">link</i>';
                      cardContainer += '<span>Shorten URL</span>';
                      cardContainer += '</button>';
                    }
                    
                    cardContainer += '</div>';
                    cardContainer += '</div>';
                  }
                } catch (e) {
                  // Skip cookies that can't be parsed (not our format)
                  continue;
                }
              }
            }
            cardContainer += '</div>';
            document.getElementById("writezone2").innerHTML = cardContainer;
          }
        }

        Dropzone.options.droppy = {
        method: "post",
        maxFilesize: 512,
        autoDiscover: false,
          init: function() {
            this.on("success", function(file, response) {
              this.removeAllFiles();
              document.getElementById("writezone").innerHTML = (window.location.protocol + '//' + window.location.hostname + '/' + response).link(window.location.protocol + '//' + window.location.hostname + ':' + window.location.port + '/' + response);
              
              // Add timestamp and file size to newly created cookies
              setTimeout(() => {
                // Get all cookies and find the one that was just created
                const allCookies = document.cookie.split(';');
                for (let i = 0; i < allCookies.length; i++) {
                  const tmpCookie = allCookies[i].split(/=(.+)/);
                  let name = tmpCookie[0];
                  name = name.replace(/\s+/g, '');
                  
                  if (tmpCookie[1]) {
                    try {
                      const decodedString = atob(tmpCookie[1]);
                      const cookieObj = JSON.parse(decodedString);
                      
                      // If this cookie doesn't have a timestamp yet, add timestamp and file size
                      if (cookieObj.sec_key && cookieObj.removal_key && !cookieObj.timestamp) {
                        cookieObj.timestamp = new Date().getTime();
                        cookieObj.file_size = file.size; // Add the actual file size from dropzone
                        
                        const updatedCookieValue = JSON.stringify(cookieObj);
                        const encodedValue = btoa(updatedCookieValue);
                        
                        // Set cookie to expire in 25 hours (a bit longer than file storage for safety)
                        const expirationDate = new Date();
                        expirationDate.setHours(expirationDate.getHours() + 25);
                        document.cookie = `${name}=${encodedValue}; expires=${expirationDate.toUTCString()}; path=/`;
                      }
                    } catch (e) {
                      // Skip invalid cookies
                      continue;
                    }
                  }
                }
                
                // Refresh the display after cookie update is complete
                checkCookies();
              }, 100); // Small delay to ensure cookie is set
            });
          }
        };

        // Clean up old cookies on page load
        cleanupOldCookies();
        checkCookies();

        // Set up periodic cleanup every 30 minutes
        setInterval(function() {
            cleanupOldCookies();
            checkCookies(); // Refresh the display after cleanup
        }, 30 * 60 * 1000); // 30 minutes

        // Auto-enable snow during November and December
        function enableSeasonalSnow() {
            const currentDate = new Date();
            const currentMonth = currentDate.getMonth(); // 0 = January, 10 = November, 11 = December
            
            // Enable snow automatically for November (10) and December (11)
            if (currentMonth === 10 || currentMonth === 11) {
                if (typeof snowStorm !== 'undefined') {
                    snowStorm.start();
                }
            }
        }

        // Call seasonal snow check after snowStorm is loaded
        setTimeout(enableSeasonalSnow, 100);

        console.log("bitnuke.io")
        console.log("see you in 24 hours...")
      </script>
