user nobody nogroup;
worker_processes 4;
daemon off;
error_log stderr;

events {
    worker_connections 768;
}

http {
    access_log /dev/stdout;
    client_max_body_size 201M;
    client_body_timeout 240s;

    #-------------------------------------
    # all server entries here
    #-------------------------------------
    server {
        listen 80 default_server;
        include /nginx/conf/mime.types;
        #default_type application/octet-stream;
        client_max_body_size 2248M;

        location = / {
            try_files $uri /static/index.html;
            #rewrite ^ $scheme://$host/index permanent;
        }

        location /link {
            root /nginx/data/bitnuke/static;
            try_files $uri /link.html;
        }

        location /persist {
            root /nginx/data/bitnuke/static;
            try_files $uri /persist.html;
        }

        location /static {
            root /nginx/data/bitnuke;
            autoindex on;
        }
        location /upload {
            proxy_pass https://bitnuke.io;
        }

        location /remove {
            proxy_pass https://bitnuke.io;
        }

        location /supload {
            proxy_pass https://bitnuke.io;
        }

        location /compress {
            proxy_pass https://bitnuke.io;
        }

        location / {
            proxy_pass https://bitnuke.io;
        }
    }
}
